name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # macos-26 带 Xcode 26（iOS 26 SDK，原生 Liquid Glass）
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          # 自动选取机器上可用的最新 Xcode（26 优先，其次 16、15.4）
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "使用 $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: 构建（未签名）
        run: |
          xcodebuild build \
            -project LiuLi.xcodeproj \
            -scheme LiuLi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LiuLi.app build/Payload/
          cd build && zip -qry LiuLi-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LiuLi-unsigned-ipa
          path: build/LiuLi-unsigned.ipa
          retention-days: 30
