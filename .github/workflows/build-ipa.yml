name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 构建（未签名）
        run: |
          xcodebuild build \
            -project LiuLi.xcodeproj \
            -scheme LiuLi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LiuLi.app build/Payload/
          cd build && zip -qry LiuLi-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LiuLi-unsigned-ipa
          path: build/LiuLi-unsigned.ipa
          retention-days: 30
